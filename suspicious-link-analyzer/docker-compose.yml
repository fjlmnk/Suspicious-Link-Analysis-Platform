version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./suspicious_links.db
      - SECRET_KEY=${SECRET_KEY:-default-secret-change-in-production}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-9d3bf6802b0c783675839ae9db6ffb233bca1b70ada00d2437f8962747259b9d}
      - SAFEBROWSING_API_KEY=${SAFEBROWSING_API_KEY:-AIzaSyCuyLHvkpZbZYv59C3DjQelC8vCdfZC3yM}
      - URLHAUS_API_KEY=${URLHAUS_API_KEY:-c16d943cbc7eb2e4265f22f829af4528f2e7053716a9b2ef}
      - VIRUSTOTAL_ENDPOINT=https://www.virustotal.com/api/v3
      - SAFEBROWSING_ENDPOINT=https://safebrowsing.googleapis.com/v4
      - URLHAUS_ENDPOINT=https://urlhaus-api.abuse.ch/v1
      - MAX_SCANS_PER_HOUR=20
      - SCAN_TIMEOUT_SEC=30
      - VIRUSTOTAL_DAILY_LIMIT=500
      - SAFEBROWSING_DAILY_LIMIT=10000
      - URLHAUS_DAILY_LIMIT=5000
      - DEMO_MODE_ENABLED=true
      - SECURITY_TEAM_EMAIL=security@company.com
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
